name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install project and dev tools
        run: pip install -e .[dev]

      - name: Run pre-commit hooks (format/lint)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Typecheck
        run: pyright

      - name: Run tests
        run: pytest ./tests/test_*.py

      - name: Run benchmark / CI test
        run: python tests/ci_test.py
      # shown on the run's Summary page. runs even when a test failed, since that's when it's wanted
      - name: Scanner summary
        if: ${{ !cancelled() }}
        run: |
          python tests/scanner_images.py
          python tests/scanner_images.py --standard
          {
            echo "### Scanner, SCAN_COLOURS camera"
            echo '```'; cat tests/scanner_images/summary.txt; echo '```'
            echo "### Scanner, standard cube colours"
            echo '```'; cat tests/scanner_images_standard/summary.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scanner images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scanner-images
          path: |
            tests/scanner_images/
            tests/scanner_images_standard/
          retention-days: 30
